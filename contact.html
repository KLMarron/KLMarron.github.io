    <section id="contact" class="contact-section">
        <div class="contact-container">

            <div class="contact-text">
                <h2>Got a Project in mind?</h2>
                <p>Let's work together!</p>
                <a href="mailto:marronkathleene@gmail.com" class="direct-email-btn">
                    Reach Out via Email
                </a>


                <div class="contact-social">
                    <a href="https://www.linkedin.com/in/kathleenejoymarron/" target="_blank" class="social-icon">
                        <i class="fab fa-linkedin-in"></i>
                    </a>
                    <a href="https://github.com/KLMarron" target="_blank" class="social-icon">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://www.facebook.com/marronnnn" target="_blank" class="social-icon">

                    </a>
                    <a href="https://www.instagram.com/kjoymarron/" target="_blank" class="social-icon">

                    </a>
                </div>
            </div>



            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Write your message..."
                            required></textarea>
                    </div>
                    <input type="hidden" name="bcc_email" value="marronkathleene@gmail.com">

                    <button type="submit" class="send-btn">
                        Send <i class="fas fa-paper-plane plane-icon"></i>
                    </button>
                </form>

            </div>
        </div>
    </section>

                </p>


                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/kathleenejoymarron/" target="_blank" class="icon">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        emailjs.init("J9gGPQ-KEEbJOe5AJ");

    </script>

    <script>
        const burger = document.querySelector('.burger');
        const nav = document.querySelector('.island-nav');

        burger.addEventListener('click', () => {
            nav.classList.toggle('active');
        });
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();

            Swal.fire({
                title: 'Sending...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            emailjs.sendForm('service_tu3gaq9', 'template_rao9l6y', this)
                .then(() => {

                    Swal.fire({
                        icon: 'success',
                        title: 'Message Sent!',
                        text: 'We will contact you soon.',
                        timer: 2000,
                        showConfirmButton: false
                    });

                    document.getElementById('contactForm').reset();

                })
                .catch(() => {

                    Swal.fire({
                        icon: 'error',
                        title: 'Failed!',
                        text: 'Something went wrong. Please try again.'
                    });

                });
        });
    </script>
